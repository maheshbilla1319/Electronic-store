<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ElectroX | Page Not Found</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

    <link rel="stylesheet" href="css/404.css">
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
    <a href="index.html" class="logo" aria-label="ElectroX Home">
    <img src="assets/image.webp" alt="">
</a>
            <nav class="desktop-nav">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="blog.html">Blog</a>
                <a href="contact.html">Contact</a>
            </nav>

            <div class="header-actions">

                <button class="icon-btn"
                        aria-label="Search"
                        title="Search">
                    ⌕
                </button>

                <button class="icon-btn"
                        aria-label="Shopping cart"
                        title="Shopping cart">
                    🛒
                </button>

                <a href="login.html" class="login-btn">
                    Login
                </a>

                <button class="menu-btn"
                        aria-label="Open menu"
                        title="Open menu"
                        aria-expanded="false">
                    ☰
                </button>

            </div>
        </div>

        <nav class="mobile-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="blog.html">Blog</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
        </nav>
    </header>


    <!-- 404 Hero -->
    <main>

        <section class="error-section">

            <div class="error-grid">

                <div class="error-content" data-aos="fade-right">

                    <span class="error-label">
                        ERROR 404
                    </span>

                    <h1>
                        Oops! This page
                        <span>disappeared.</span>
                    </h1>

                    <p>
                        The page you're looking for may have been moved,
                        deleted, or the link may be incorrect. Let's get
                        you back to the ElectroX experience.
                    </p>

                    <div class="error-buttons">

                        <a href="index.html" class="primary-btn">
                            Back to Home
                            <span>→</span>
                        </a>

                <a href="javascript:history.back()" class="secondary-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Go Back</span>
                </a>

                    </div>

                </div>


                <div class="error-visual" data-aos="zoom-in">

                    <div class="orbit orbit-one"></div>
                    <div class="orbit orbit-two"></div>

                    <div class="error-number">

                        <span class="four">4</span>

                        <div class="zero">
                            <div class="zero-inner">
                                <span>EX</span>
                            </div>
                        </div>

                        <span class="four">4</span>

                    </div>

                    <div class="floating-chip chip-one">
                        ⚡
                    </div>

                    <div class="floating-chip chip-two">
                        ✦
                    </div>

                    <div class="floating-chip chip-three">
                        +
                    </div>

                </div>

            </div>

        </section>




    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="js/404.js"></script>

</body>
</html>
